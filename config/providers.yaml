artificial_analysis:
  min_score: 24

infisical:
  environment: dev
  shared_project_id_env: INFISICAL_SHARED_PROJECT_ID
  discovery_project_id_env: INFISICAL_DISCOVERY_PROJECT_ID

local_llm:
  base_url: https://opencode.ai/zen/v1
  model: mimo-v2.5-free
  secret: OPENCODE_ZEN_API_KEY

providers:
  - name: groq
    base_url: https://api.groq.com/openai/v1
    secret: GROQ_API_KEY

  - name: mistral
    base_url: https://api.mistral.ai/v1
    secret: MISTRAL_API_KEY

  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    secret: OPENROUTER_API_KEY